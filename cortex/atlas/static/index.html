<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project map</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1c1c1a; --muted: #6a6a64; --line: #d4d3cb;
    --accent: #2f6fed; --ok: #2e9e5b; --warn: #d98a00; --bad: #d64545; --node: #8c8c85;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131519; --panel: #1b1e24; --ink: #e7e7e1; --muted: #9a9a92; --line: #30343c;
            --accent: #6c9bff; --ok: #4fc183; --warn: #f0a93a; --bad: #ef6b6b; --node: #7b7b75; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 450; }
  .search { position: relative; flex: 1 1 260px; max-width: 460px; }
  input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
                       background: var(--bg); color: var(--ink); font: inherit; }
  input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .results { display: none; position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel);
             border: 1px solid var(--line); border-radius: 8px; max-height: 320px; overflow-y: auto; overflow-x: hidden; box-shadow: 0 8px 28px #0003; }
  .results.open { display: block; }
  .result { display: grid; grid-template-columns: 54px 1fr; gap: 2px 8px; width: 100%; padding: 7px 10px; text-align: left;
            border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .result .muted { grid-column: 2; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result:hover, .result.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tag { grid-row: span 2; align-self: start; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-left: auto; font-size: 13px; }
  label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  select, button { font: inherit; color: inherit; }
  select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  button { cursor: pointer; }
  .pill { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; }
  .pill:hover { border-color: var(--accent); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  #banner { margin: 0; padding: 7px 16px; background: color-mix(in srgb, var(--warn) 16%, var(--panel)); border-bottom: 1px solid var(--line); font-size: 13px; }
  #banner[hidden], #changed[hidden], #attention[hidden], #tip[hidden], #empty[hidden] { display: none; }
  main { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         padding: 4px 8px; font-size: 12px; max-width: 420px; box-shadow: 0 4px 16px #0003; z-index: 3; }
  aside { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(380px, calc(100% - 24px)); background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow: auto; transform: translateX(calc(100% + 24px));
          transition: transform .18s ease; box-shadow: 0 10px 40px #0004; z-index: 4; }
  aside.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }
  aside h2 { margin: 0 28px 6px 0; font-size: 17px; word-break: break-word; }
  aside h3 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .close { position: absolute; top: 8px; right: 10px; font-size: 22px; line-height: 1; }
  .ghost { background: none; border: 0; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .ghost:hover { color: var(--ink); background: var(--bg); }
  .primary { margin: 12px 0 0; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .path { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--bg); padding: 2px 6px; border-radius: 5px; word-break: break-all; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .body { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 10px 0; max-height: 280px; overflow: auto; }
  .card { display: grid; gap: 3px; width: 100%; text-align: left; margin: 6px 0; padding: 9px 11px; border: 1px solid var(--line);
          border-radius: 9px; background: var(--bg); }
  .card:hover { border-color: var(--accent); }
  .card .row { margin: 0; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 2px 0; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); text-align: left; word-break: break-all; }
  .link:hover { text-decoration: underline; }
  footer { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; padding: 8px 16px; border-top: 1px solid var(--line);
           background: var(--panel); font-size: 12px; color: var(--muted); }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.diamond { border-radius: 1px; transform: rotate(45deg) scale(.85); }
  #empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; padding: 24px; color: var(--muted); }
  #empty code { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Project map <span id="project"></span></h1>
  <div class="search">
    <input id="search" type="search" placeholder="Search files, functions, notes   ( / )" autocomplete="off" aria-label="Search the map">
    <div id="results" class="results" role="listbox"></div>
  </div>
  <div class="controls">
    <label><input id="toggle-notes" type="checkbox" checked> Notes</label>
    <label><input id="toggle-weak" type="checkbox" checked> Weak links</label>
    <label>Colour by
      <select id="color"><option value="area">area</option><option value="folder">folder</option><option value="health">note health</option></select>
    </label>
    <button id="attention" class="pill warn" hidden></button>
    <button id="changed" class="pill" hidden>Map changed - refresh</button>
    <button id="fit" class="pill" title="Fit everything (f)">Fit</button>
    <button id="refresh" class="pill" title="Re-read the graph and notes">Refresh</button>
  </div>
</header>
<p id="banner" hidden></p>
<main>
  <canvas id="map" aria-label="Map of the project's files, their links, and the notes pinned to them"></canvas>
  <div id="tip" hidden></div>
  <aside id="panel" aria-live="polite"></aside>
  <div id="empty" hidden>
    <strong>Nothing to draw yet</strong>
    <span>Build a code graph (offline, no model):  <code>graphify update .</code></span>
    <span>Start the project's memory:  <code>cc palace init</code></span>
  </div>
</main>
<footer>
  <span id="status">loading...</span>
  <span id="legend"></span>
  <span>click: details &nbsp; double-click a file: its functions &nbsp; drag: move &nbsp; wheel: zoom &nbsp; /: search</span>
</footer>
<script src="/force.js"></script>
<script src="/app.js"></script>
</body>
</html>
